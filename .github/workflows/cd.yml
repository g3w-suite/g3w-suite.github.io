name: Deploy static content to Pages

on:
  workflow_run:
    workflows: ["Test BDD"]
    types: [completed]
  pull_request_target:
    types: [closed]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pull-requests: read
  pages: write
  id-token: write

jobs:
  update-preview:
    if: >-
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.event == 'pull_request' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_repository.full_name == github.repository &&
       github.event.workflow_run.head_branch != '') ||
      (github.event_name == 'pull_request_target' &&
       github.event.pull_request.base.ref == 'vanilla' &&
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    concurrency:
      group: preview-state-${{ github.event.workflow_run.head_branch || github.event.pull_request.head.ref }}
      cancel-in-progress: false
    permissions:
      contents: write
      actions: read
      pull-requests: read
    outputs:
      eligible: ${{ steps.pr.outputs.eligible }}
      number: ${{ steps.pr.outputs.number }}
    steps:
      - name: Verify pull request
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_run" ]]; then
            PR_NUMBER=$(gh api --method GET "repos/$GITHUB_REPOSITORY/pulls" \
              -f state=open -f base=vanilla -f "head=$GITHUB_REPOSITORY_OWNER:$HEAD_BRANCH" \
              --jq '.[0].number // empty')
          fi
          if [[ -z "$PR_NUMBER" ]]; then
            exit 0
          fi
          pr=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER")
          if [[ "$(jq -r '.head.repo.full_name' <<< "$pr")" != "$GITHUB_REPOSITORY" ||
                "$(jq -r '.base.ref' <<< "$pr")" != "vanilla" ]]; then
            exit 0
          fi
          echo "eligible=true" >> "$GITHUB_OUTPUT"
          echo "number=$PR_NUMBER" >> "$GITHUB_OUTPUT"
      - name: Download pull request preview
        if: github.event_name == 'workflow_run' && steps.pr.outputs.eligible == 'true'
        uses: actions/download-artifact@v4
        with:
          name: pr-preview-${{ steps.pr.outputs.number }}
          path: ${{ runner.temp }}/pr-preview
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - name: Checkout default branch
        if: github.event_name == 'workflow_run' && steps.pr.outputs.eligible == 'true'
        uses: actions/checkout@v4
        with:
          ref: vanilla
      - name: Create or update preview branch
        if: github.event_name == 'workflow_run' && steps.pr.outputs.eligible == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        run: |
          set -euo pipefail
          repo_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
          branch="pr-preview-$PR_NUMBER"
          if ! git ls-remote --exit-code --heads "$repo_url" "$branch" >/dev/null 2>&1; then
            base_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/vanilla" --jq .object.sha)
            if ! gh api "repos/$GITHUB_REPOSITORY/git/refs" -X POST \
              -f "ref=refs/heads/$branch" -f "sha=$base_sha" >/dev/null; then
              git ls-remote --exit-code --heads "$repo_url" "$branch" >/dev/null
            fi
          fi
          gh auth setup-git
          git fetch --depth=1 origin "refs/heads/$branch:refs/remotes/origin/$branch"
          git switch --track -c "$branch" "origin/$branch"
          test -f "$RUNNER_TEMP/pr-preview/it/index.html"
          if find "$RUNNER_TEMP/pr-preview" -type l -print -quit | grep -q .; then
            echo "::error::Preview artifact contains a symbolic link"
            exit 1
          fi
          rm -rf "pr/$PR_NUMBER"
          mkdir -p "pr/$PR_NUMBER"
          cp -R "$RUNNER_TEMP/pr-preview/." "pr/$PR_NUMBER/"
          git add -A -- "pr/$PR_NUMBER"
          if git diff --cached --quiet; then
            exit 0
          fi
          git -c user.name='github-actions[bot]' \
            -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -m "Update preview for PR #$PR_NUMBER" \
            -m "Co-authored-by: Copilot <223556219+Copilot@users.noreply.github.com>"
          git push origin "$branch"
      - name: Delete preview branch
        if: github.event_name == 'pull_request_target' && steps.pr.outputs.eligible == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        run: |
          branch="pr-preview-$PR_NUMBER"
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$branch" >/dev/null 2>&1; then
            gh api "repos/$GITHUB_REPOSITORY/git/refs/heads/$branch" -X DELETE
          fi

  deploy:
    needs: update-preview
    if: >-
      always() &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event != 'pull_request' &&
        github.event.workflow_run.head_branch == 'vanilla') ||
       (needs.update-preview.result == 'success' &&
        needs.update-preview.outputs.eligible == 'true'))
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      contents: read
      actions: read
      pull-requests: read
      issues: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Download validated commit
        if: github.event_name == 'workflow_run' && github.event.workflow_run.event != 'pull_request' && github.event.workflow_run.head_branch == 'vanilla'
        uses: actions/download-artifact@v4
        with:
          name: deployment-sha
          path: ${{ runner.temp }}/ci-deployment
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - name: Read validated commit
        if: github.event_name == 'workflow_run' && github.event.workflow_run.event != 'pull_request' && github.event.workflow_run.head_branch == 'vanilla'
        id: validated
        shell: bash
        run: |
          sha=$(cat "$RUNNER_TEMP/ci-deployment/deployment-sha.txt")
          if [[ ! "$sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Invalid deployment commit SHA"
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - name: Read deployed production commit
        if: needs.update-preview.result == 'success' && needs.update-preview.outputs.eligible == 'true'
        id: production
        env:
          PAGE_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          sha=$(curl --fail --silent --show-error --header 'Cache-Control: no-cache' \
            "$PAGE_URL/production-sha.txt?run=$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT")
          if [[ ! "$sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Invalid deployed production commit SHA"
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.production.outputs.sha || steps.validated.outputs.sha || github.sha }}
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Build site
        run: npm run build
        env:
          SITE_BASE_PATH: ${{ steps.pages.outputs.base_path }}
      - name: Record deployed production commit
        run: git rev-parse HEAD > static/production-sha.txt
      - name: Include open pull request previews
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          repo_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
          gh auth setup-git
          prs=$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls?state=open&per_page=100" \
            --jq '.[] | select(.head.repo.full_name == env.GITHUB_REPOSITORY) | .number')
          while read -r number; do
            [[ "$number" =~ ^[0-9]+$ ]] || continue
            branch="pr-preview-$number"
            if ! git ls-remote --exit-code --heads "$repo_url" "$branch" >/dev/null 2>&1; then
              continue
            fi
            git fetch --depth=1 origin "refs/heads/$branch:refs/remotes/origin/$branch"
            git archive --format=tar "refs/remotes/origin/$branch" "pr/$number" | tar -xf - -C static
          done <<< "$prs"
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # ponytail: each open PR adds a full static copy; use isolated hosting if Pages approaches its size limit.
          path: static
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
      - name: Publish preview link
        if: needs.update-preview.outputs.eligible == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ needs.update-preview.outputs.number }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          page_url=$(gh api "repos/$GITHUB_REPOSITORY/pages" --jq .html_url)
          page_url=${page_url%/}
          if [[ "$EVENT_NAME" == "pull_request_target" ]]; then
            body="The preview for this PR was removed because it was closed.<!-- g3w-suite-pr-preview -->"
          else
            url="$page_url/pr/$PR_NUMBER/"
            body="Preview: [Open the site preview]($url)<!-- g3w-suite-pr-preview -->"
          fi
          comment_id=$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments?per_page=100" \
            --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | contains("<!-- g3w-suite-pr-preview -->"))) | .id' \
            | tail -n 1)
          if [[ -n "$comment_id" ]]; then
            gh api "repos/$GITHUB_REPOSITORY/issues/comments/$comment_id" -X PATCH -f "body=$body"
          else
            gh api "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" -f "body=$body"
          fi
