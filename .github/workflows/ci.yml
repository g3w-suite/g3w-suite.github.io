name: Test BDD

on:
  push:
    branches-ignore:
      - pr-preview-*
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Find missing translations
        id: translations
        run: node utils/update-translations.js --dry-run
      - uses: actions/setup-python@v5
        if: steps.translations.outputs.has_missing == 'true'
        with:
          python-version: '3.11'
      - name: Install translation dependencies
        if: steps.translations.outputs.has_missing == 'true'
        env:
          ARGOS_CHUNK_TYPE: MINISBD
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install argostranslate==1.11.0
      - name: Update translation catalogs
        if: steps.translations.outputs.has_changes == 'true'
        env:
          ARGOS_CHUNK_TYPE: MINISBD
        run: node utils/update-translations.js
      - run: python -m unittest discover -s test -p 'test_*.py'
      - run: npm test
      - name: Upload translations for fork pull requests
        if: steps.translations.outputs.has_changes == 'true' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
        uses: actions/upload-artifact@v4
        with:
          name: updated-translations
          path: i18n/*.json
          if-no-files-found: error
      - name: Commit updated translations
        if: steps.translations.outputs.has_changes == 'true' && ((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) || (github.event_name != 'pull_request' && github.ref_type == 'branch'))
        env:
          TARGET_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          git add -- 'i18n/*.json'
          if git diff --cached --quiet; then exit 0; fi
          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -m 'Update website translations' \
              -m 'Co-authored-by: Copilot <223556219+Copilot@users.noreply.github.com>'
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"
      - name: Record validated commit
        if: github.ref == 'refs/heads/vanilla' && github.event_name != 'pull_request'
        run: git rev-parse HEAD > "$RUNNER_TEMP/deployment-sha.txt"
      - uses: actions/upload-artifact@v4
        if: github.ref == 'refs/heads/vanilla' && github.event_name != 'pull_request'
        with:
          name: deployment-sha
          path: ${{ runner.temp }}/deployment-sha.txt
          if-no-files-found: error
      - name: Build pull request preview
        if: github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'vanilla' && github.event.pull_request.head.repo.full_name == github.repository
        run: npm run build
        env:
          SITE_BASE_PATH: /pr/${{ github.event.pull_request.number }}
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'vanilla' && github.event.pull_request.head.repo.full_name == github.repository
        with:
          name: pr-preview-${{ github.event.pull_request.number }}
          path: static
          retention-days: 90
          if-no-files-found: error
