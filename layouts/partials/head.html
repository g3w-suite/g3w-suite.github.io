<meta charset="UTF-8">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>{{ .Params.pageTitle | default .Title }}</title>
<meta name="description" content="{{ .Params.description }}">
{{ with .Params.keywords }}<meta name="keywords" content="{{ . }}">{{ end }}

<!-- Open Graph -->
<meta property="og:title" content="{{ .Params.ogTitle | default .Title }}">
<meta property="og:description" content="{{ .Params.ogDescription | default .Params.description }}">
{{ with .Params.ogImage }}<meta property="og:image" content="{{ . }}">{{ end }}
<meta property="og:url" content="{{ .Permalink }}">
<meta property="og:type" content="website">

<!-- FontAwesome for Icons -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

{{ if .Params.leaflet }}
<!-- Leaflet (OpenStreetMap) -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin="">
<script defer src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
        crossorigin=""></script>
{{ end }}

<!-- Central Stylesheet -->
<link rel="stylesheet" href="{{ relURL "assets/style.css" }}">
