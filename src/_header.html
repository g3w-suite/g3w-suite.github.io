
<!doctype html>
<html lang="{{lang}}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="{{siteRoot}}app.css">
  {{pageHead}}
</head>
<body class="{{pageClass}}">
<header class="site-header">
  <div class="container">
    <a href="{{langRoot}}" class="site-logo">
      <img src="{{siteRoot}}img/site-g3w-suite-logo.avif" alt="G3W-Suite" height="44">
    </a>
    <button class="menu-toggle-btn" aria-expanded="false" aria-controls="main-nav" aria-label="{{t 'Open menu'}}">
      <span class="hamburger"></span>
    </button>
    <nav class="main-nav" id="main-nav" aria-label="{{t 'Main navigation'}}">
      <ul class="nav-list">
        <li><a href="{{langRoot}}about/" data-nav-key="about">{{t 'About'}}</a></li>
        <li><a href="{{documentationUrl}}" data-nav-key="documentation">{{t 'Documentation'}}</a></li>
        <li><a href="{{langRoot}}sponsors/" data-nav-key="sponsors">{{t 'Sponsors'}}</a></li>
        <li><a href="{{langRoot}}news/" data-nav-key="news">{{t 'News'}}</a></li>
        <li><a href="{{langRoot}}community/" data-nav-key="community">{{t 'Community'}}</a></li>
      </ul>
      <div class="lang-switcher">
        <button type="button" aria-haspopup="dialog" aria-expanded="false" aria-controls="language-dialog" aria-labelledby="language-title current-language">
          <span id="current-language" lang="{{lang}}">{{currentLanguage}}</span>
          <span aria-hidden="true">▾</span>
        </button>
        <dialog id="language-dialog" aria-labelledby="language-title">
          <h2 id="language-title">{{t 'Choose a language'}}</h2>
          <ul>{{languageLinks}}</ul>
          <form method="dialog"><button>{{t 'Close'}}</button></form>
        </dialog>
      </div>
    </nav>
  </div>
</header>
