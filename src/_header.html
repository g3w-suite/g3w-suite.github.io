
<!doctype html>
<html lang="{{lang}}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="{{siteRoot}}style.css">
  {{pageHead}}
</head>
<body class="{{pageClass}}">
<header class="site-header">
  <div class="container">
    <a href="{{langRoot}}" class="site-logo">
      <img src="{{siteRoot}}img/site-g3w-suite-logo.png" alt="G3W-Suite" height="44">
    </a>
    <button class="menu-toggle-btn" aria-expanded="false" aria-controls="main-nav" aria-label="{{t 'Open menu'}}">
      <span class="hamburger"></span>
    </button>
    <nav class="main-nav" id="main-nav" aria-label="{{t 'Main navigation'}}">
      <ul class="nav-list">
        <li><a href="{{langRoot}}" data-nav-key="index">{{t 'About'}}</a></li>
        <li><a href="{{langRoot}}demo/" data-nav-key="demo">{{t 'Try it'}}</a></li>
        <li><a href="{{documentationUrl}}" data-nav-key="documentation">{{t 'Documentation'}}</a></li>
        <li><a href="{{langRoot}}sponsor/" data-nav-key="sponsor">{{t 'Sponsors'}}</a></li>
        <li><a href="{{langRoot}}news/" data-nav-key="news">{{t 'News'}}</a></li>
        <li><a href="{{langRoot}}community/" data-nav-key="community">{{t 'Community'}}</a></li>
      </ul>
      <div class="lang-switcher">
        <a href="{{itPage}}" lang="it" hreflang="it" data-lang-key="it">IT</a>
        <a href="{{enPage}}" lang="en" hreflang="en" data-lang-key="en">EN</a>
      </div>
    </nav>
  </div>
</header>

<script type="application/json" data-i18n>
  {
    "it": {
      "About": "Il progetto",
      "Community": "Community",
      "Documentation": "Documentazione",
      "Main navigation": "Navigazione principale",
      "News": "Novità",
      "Open menu": "Apri menu",
      "Sponsors": "Sponsor",
      "Try it": "Esplora"
    }
  }
</script>
